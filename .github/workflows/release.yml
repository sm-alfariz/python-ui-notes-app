name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Catat-Segala-linux
            asset_name: Catat-Segala-linux
          - os: windows-latest
            artifact_name: Catat-Segala-windows.exe
            asset_name: Catat-Segala-windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0 libgl1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyside6 pyside6-addons pyside6-essentials
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name Catat-Segala main.py

    - name: Rename artifact (Linux)
      if: runner.os == 'Linux'
      run: mv dist/Catat-Segala dist/${{ matrix.artifact_name }}

    - name: Rename artifact (Windows)
      if: runner.os == 'Windows'
      run: mv dist/Catat-Segala.exe dist/${{ matrix.artifact_name }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          Catat-Segala-linux/Catat-Segala-linux
          Catat-Segala-windows/Catat-Segala-windows
