name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Catat-Segala-linux
            asset_name: Catat-Segala-linux
          - os: windows-latest
            artifact_name: Catat-Segala-windows.exe
            asset_name: Catat-Segala-windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0 libgl1

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka ordered-set pyinstaller pillow
        pip install -r requirements.txt

    - name: Build with Nuitka (Linux)
      if: runner.os == 'Linux'
      run: |
        python -m nuitka --standalone --onefile \
          --enable-plugin=pyside6 \
          --output-filename=Catat-Segala-linux \
          --output-dir=dist \
          main.py

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --icon=assets/logo.png --name Catat-Segala-windows main.py

    - name: Package release (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p dist/stage/.catat-segala
        cp language.ini dist/stage/.catat-segala/
        cp -r assets dist/stage/.catat-segala/
        cp -r src/themes dist/stage/.catat-segala/themes
        mv dist/Catat-Segala-linux dist/stage/
        cd dist/stage && tar -czf ../../${{ matrix.asset_name }}.tar.gz Catat-Segala-linux .catat-segala

    - name: Package release (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir dist\stage\.catat-segala
        copy language.ini dist\stage\.catat-segala\
        xcopy /E /I assets dist\stage\.catat-segala\assets
        xcopy /E /I src\themes dist\stage\.catat-segala\themes
        move dist\Catat-Segala-windows.exe dist\stage\
        cd dist\stage && tar -czf ..\..\${{ matrix.asset_name }}.tar.gz Catat-Segala-windows.exe .catat-segala

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.asset_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          Catat-Segala-linux/Catat-Segala-linux.tar.gz
          Catat-Segala-windows/Catat-Segala-windows.tar.gz
